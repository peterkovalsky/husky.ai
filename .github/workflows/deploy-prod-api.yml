name: Deploy Prod API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'templates/**'
      - 'database/migrations/**'
      - '.github/workflows/deploy-prod-api.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ${{ vars.PROD_ECR_REPOSITORY }}

jobs:
  # Run migrations before deploying
  migrate:
    uses: ./.github/workflows/run-migrations.yml
    secrets: inherit

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: migrate

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build, tag, and push image to Amazon ECR
      run: |
        # Create build context with api and templates
        mkdir -p build-context

        # Copy everything from api directory (including hidden files)
        cp -r api/. build-context/

        # Copy templates directory
        cp -r templates build-context/templates

        # Remove unwanted directories from build context
        rm -rf build-context/projects build-context/logs build-context/node_modules build-context/dist

        # Build the Docker image from the build context
        docker build -t $ECR_REPOSITORY:latest -t $ECR_REPOSITORY:$GITHUB_SHA build-context

        # Push both tags to ECR
        docker push $ECR_REPOSITORY:latest
        docker push $ECR_REPOSITORY:$GITHUB_SHA
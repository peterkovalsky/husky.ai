name: Deploy Prod API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'templates/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-west-1
  ECR_REPOSITORY: 085843960390.dkr.ecr.us-west-1.amazonaws.com/husky.ai/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build, tag, and push image to Amazon ECR
      run: |
        # Create build context with api and templates
        mkdir -p build-context
        cp -r api/* build-context/
        cp -r templates build-context/templates
        
        # Build the Docker image from the build context
        docker build -t $ECR_REPOSITORY:latest -t $ECR_REPOSITORY:$GITHUB_SHA build-context
        
        # Push both tags to ECR
        docker push $ECR_REPOSITORY:latest
        docker push $ECR_REPOSITORY:$GITHUB_SHA
    
    - name: Update App Runner service
      run: |
        # Get the App Runner service ARN (you'll need to replace this with your actual service name)
        SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='husky-ai-api'].ServiceArn" --output text)
        
        if [ -z "$SERVICE_ARN" ]; then
          echo "App Runner service 'husky-ai-api' not found. Please create it first."
          exit 1
        fi
        
        # Start deployment with the new image
        aws apprunner start-deployment --service-arn $SERVICE_ARN
        
        # Wait for deployment to complete
        echo "Waiting for deployment to complete..."
        aws apprunner wait service-operation-completed --service-arn $SERVICE_ARN
        
        # Get the service URL
        SERVICE_URL=$(aws apprunner describe-service --service-arn $SERVICE_ARN --query 'Service.ServiceUrl' --output text)
        echo "Deployment completed. Service URL: https://$SERVICE_URL"
name: Deploy Worker to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'templates/**'

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-east1
  SERVICE: husky-worker
  REPOSITORY: husky-worker

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push
        run: |
          docker build -f worker/Dockerfile \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/worker:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/worker:latest \
            .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/worker:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/worker:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/worker:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --execution-environment gen2 \
            --no-cpu-throttling \
            --cpu 4 \
            --memory 8Gi \
            --min-instances 1 \
            --max-instances 3 \
            --port 3334 \
            --timeout 900 \
            --set-env-vars="NODE_ENV=production,WORKER_PORT=3334,AI_PROVIDER_PRIMARY=anthropic,AI_MODEL_PRIMARY=claude-sonnet-4-5-20250929,AI_PROVIDER_FAST=anthropic,AI_MODEL_FAST=claude-haiku-4-5-20251001" \
            --set-secrets="AWS_REGION=aws-region:latest,AWS_ACCESS_KEY_ID=aws-access-key-id:latest,AWS_SECRET_ACCESS_KEY=aws-secret-access-key:latest,SQS_QUEUE_URL=sqs-queue-url:latest,S3_BUCKET_NAME=s3-bucket-name:latest,S3_PROJECTS_BUCKET_NAME=s3-projects-bucket-name:latest,S3_BUCKET_PUBLIC_MEDIA=s3-bucket-public-media:latest,SUPABASE_URL=supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,OPENAI_API_KEY=openai-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,CLOUDFLARE_API_TOKEN=cloudflare-api-token:latest,CLOUDFLARE_ZONE_ID=cloudflare-zone-id:latest,CF_ACCOUNT_ID=cf-account-id:latest,CF_R2_ACCESS_KEY=cf-r2-access-key:latest,CF_R2_SECRET_KEY=cf-r2-secret-key:latest" \
            --cpu-boost

      - name: Verify Deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --format 'value(status.url)')
          curl -f "$SERVICE_URL/health" || exit 1

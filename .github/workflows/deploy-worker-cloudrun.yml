name: Deploy Worker to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'templates/**'

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-east1
  SERVICE: husky-worker
  REPOSITORY: husky-worker

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push
        run: |
          docker build -f worker/Dockerfile \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/worker:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/worker:latest \
            .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/worker:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/worker:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/worker:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --execution-environment gen2 \
            --no-cpu-throttling \
            --cpu 2 \
            --memory 4Gi \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 1 \
            --port 3334 \
            --timeout 900 \
            --set-env-vars="NODE_ENV=production,WORKER_PORT=3334,QUEUE_PROVIDER=cloudtasks,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GCP_LOCATION=us-east1,CLOUD_TASKS_QUEUE_ID=husky-jobs,AI_PROVIDER_PRIMARY=gemini,AI_MODEL_PRIMARY=gemini-3-pro-preview,AI_PROVIDER_FAST=anthropic,AI_MODEL_FAST=claude-haiku-4-5-20251001,AI_AUTOFIX_MAX_ATTEMPTS=3,AI_MODEL_AUTOFIX=claude-sonnet-4-5-20250929,R2_PUBLIC_MEDIA_BASE_URL=https://media.huskystudio.app" \
            --set-secrets="WORKER_URL=worker-url:latest,CLOUD_TASKS_SERVICE_ACCOUNT=cloud-tasks-service-account:latest,SUPABASE_URL=supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,CLOUDFLARE_API_TOKEN=cloudflare-api-token:latest,CLOUDFLARE_ZONE_ID=cloudflare-zone-id:latest,CLOUDFLARE_ACCOUNT_ID=cloudflare-account-id:latest,CLOUDFLARE_KV_NAMESPACE_ID=cloudflare-kv-namespace-id:latest,PUBLISH_DOMAIN=publish-domain:latest,CLOUDFLARE_R2_BUCKET_NAME=cloudflare-r2-bucket-name:latest,CLOUDFLARE_R2_ACCESS_KEY_ID=cloudflare-r2-access-key-id:latest,CLOUDFLARE_R2_SECRET_ACCESS_KEY=cloudflare-r2-secret-access-key:latest,CLOUDFLARE_R2_ENDPOINT=cloudflare-r2-endpoint:latest,CLOUDFLARE_R2_PREVIEW_BUCKET=cloudflare-r2-preview-bucket:latest,CLOUDFLARE_R2_PROJECTS_BUCKET=cloudflare-r2-projects-bucket:latest,CLOUDFLARE_R2_PUBLIC_MEDIA_BUCKET=cloudflare-r2-public-media-bucket:latest,R2_PREVIEW_BASE_URL=r2-preview-base-url:latest,POSTHOG_API_KEY=posthog-api-key:latest,POSTHOG_HOST=posthog-host:latest" \
            --cpu-boost \
            --allow-unauthenticated

      - name: Verify Deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --format 'value(status.url)')
          curl -f "$SERVICE_URL/health" || exit 1

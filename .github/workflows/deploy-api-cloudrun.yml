name: Deploy API to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'templates/**'
      - 'database/migrations/**'
      - '.github/workflows/deploy-api-cloudrun.yml'

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-east1
  SERVICE: husky-api
  REPOSITORY: husky-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Run database migrations
        working-directory: api
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run migrate

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push
        run: |
          # Create Dockerfile for API (includes templates)
          cat > api/Dockerfile.cloudrun << 'EOF'
          # Use Node.js 22 LTS Alpine for smaller image size
          FROM node:22-alpine

          # Set working directory
          WORKDIR /app

          # Install system dependencies for native modules
          RUN apk add --no-cache \
              python3 \
              make \
              g++

          # Copy package files
          COPY api/package*.json ./

          # Install all dependencies (including dev dependencies for build)
          RUN npm ci && npm cache clean --force

          # Copy source code
          COPY api/src ./src
          COPY api/tsconfig.json ./
          COPY api/nodemon.json ./

          # Copy templates (needed for template-based operations)
          COPY templates ./templates

          # Build the TypeScript code
          RUN npm run build

          # Set NODE_ENV to production and remove development dependencies and source files
          ENV NODE_ENV=production
          RUN npm prune --production && \
              rm -rf src tsconfig.json nodemon.json

          # Create non-root user for security
          RUN addgroup -g 1001 -S nodejs && \
              adduser -S api -u 1001

          # Change ownership of the app directory
          RUN chown -R api:nodejs /app
          USER api

          # Expose the port
          EXPOSE 3333

          # Health check
          HEALTHCHECK --interval=30s --timeout=10s --start-period=30s --retries=3 \
              CMD node -e "require('http').get('http://localhost:3333/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"

          # Start the application
          CMD ["npm", "start"]
          EOF

          docker build -f api/Dockerfile.cloudrun \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:latest \
            .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --execution-environment gen2 \
            --cpu 2 \
            --memory 2Gi \
            --min-instances 1 \
            --max-instances 10 \
            --port 3333 \
            --timeout 60 \
            --concurrency 80 \
            --set-env-vars="NODE_ENV=production,QUEUE_PROVIDER=cloudtasks,GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},GCP_LOCATION=us-east1,CLOUD_TASKS_QUEUE_ID=husky-jobs,AI_PROVIDER_PRIMARY=gemini,AI_MODEL_PRIMARY=gemini-3-pro-preview,AI_PROVIDER_FAST=anthropic,AI_MODEL_FAST=claude-haiku-4-5-20251001" \
            --set-secrets="WORKER_URL=worker-url:latest,CLOUD_TASKS_SERVICE_ACCOUNT=cloud-tasks-service-account:latest,AWS_REGION=aws-region:latest,AWS_ACCESS_KEY_ID=aws-access-key-id:latest,AWS_SECRET_ACCESS_KEY=aws-secret-access-key:latest,S3_BUCKET_NAME=s3-bucket-name:latest,S3_PROJECTS_BUCKET_NAME=s3-projects-bucket-name:latest,S3_BUCKET_PUBLIC_MEDIA=s3-bucket-public-media:latest,APP_PREVIEW_BASE_URL=app-preview-base-url:latest,SUPABASE_URL=supabase-url:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-service-role-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,CLOUDFLARE_API_TOKEN=cloudflare-api-token:latest,CLOUDFLARE_ZONE_ID=cloudflare-zone-id:latest,CLOUDFLARE_ACCOUNT_ID=cloudflare-account-id:latest,CLOUDFLARE_KV_NAMESPACE_ID=cloudflare-kv-namespace-id:latest,PUBLISH_DOMAIN=publish-domain:latest,CLOUDFLARE_R2_BUCKET_NAME=cloudflare-r2-bucket-name:latest,CLOUDFLARE_R2_ACCESS_KEY_ID=cloudflare-r2-access-key-id:latest,CLOUDFLARE_R2_SECRET_ACCESS_KEY=cloudflare-r2-secret-access-key:latest,CLOUDFLARE_R2_ENDPOINT=cloudflare-r2-endpoint:latest,CLOUDFLARE_R2_PUBLIC_MEDIA_BUCKET=cloudflare-r2-public-media-bucket:latest,R2_PUBLIC_MEDIA_BASE_URL=r2-public-media-base-url:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,STRIPE_BASIC_PRICE_ID=stripe-basic-price-id:latest,STRIPE_PRO_PRICE_ID=stripe-pro-price-id:latest,POSTHOG_API_KEY=posthog-api-key:latest,POSTHOG_HOST=posthog-host:latest" \
            --allow-unauthenticated

      - name: Verify Deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --format 'value(status.url)')
          curl -f "$SERVICE_URL/health" || exit 1

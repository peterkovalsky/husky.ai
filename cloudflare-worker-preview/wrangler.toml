name = "husky-preview-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# =============================================================================
# Development Environment (default)
# =============================================================================
[[r2_buckets]]
binding = "PREVIEW_BUCKET"
bucket_name = "dev-husky-app-previews"

[vars]
# Allowed origins for iframe embedding (comma-separated)
# Dev: localhost for development, app domain for staging
ALLOWED_ORIGINS = "https://app.huskystudio.app,https://dev.huskystudio.app,http://localhost:5173"

[[routes]]
pattern = "preview-dev.huskystudio.app"
custom_domain = true

# =============================================================================
# Production Environment
# Deploy with: npx wrangler deploy --env production
# =============================================================================
[env.production]
name = "husky-preview-worker-prod"

[[env.production.r2_buckets]]
binding = "PREVIEW_BUCKET"
bucket_name = "prod-husky-app-previews"

[env.production.vars]
# Allowed origins for iframe embedding (comma-separated)
# Prod: only production app domain
ALLOWED_ORIGINS = "https://app.huskystudio.app"

[[env.production.routes]]
pattern = "preview.huskystudio.app"
custom_domain = true

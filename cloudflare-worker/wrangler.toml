name = "husky-published-sites"
main = "src/index.ts"
compatibility_date = "2025-01-15"

# R2 Bucket binding (production)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "prod-husky-published-apps"

# KV Namespace binding (required for domain-to-project mapping)
[[kv_namespaces]]
binding = "SUBDOMAIN_MAPPING"
id = "ffafafa93adf4e3fb68d190bcb905eb2"

[vars]
# External husky.js URL (hosted on R2 public media bucket)
HUSKY_JS_URL = "https://media.huskystudio.app/husky.js?v=2"

# Routes (configure after deployment via Cloudflare dashboard)
# Recommended route pattern for Cloudflare for SaaS:
# - Pattern: */*
#   This wildcard route catches ALL traffic (subdomains + custom domains)
#   and works regardless of customer DNS proxy settings (orange/grey cloud)
